<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242c42"/>
      <stop offset="1" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="k" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a99bff"/>
      <stop offset="0.55" stop-color="#7c6cf7"/>
      <stop offset="1" stop-color="#5b4bd6"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee0cd"/>
      <stop offset="1" stop-color="#2bb8a6"/>
    </linearGradient>
  </defs>

  <!-- подложка -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"
        stroke="#2c3348" stroke-width="2"/>

  <!-- чип-гексагон -->
  <path d="M64 22 L100.4 43 L100.4 85 L64 106 L27.6 85 L27.6 43 Z"
        fill="none" stroke="url(#t)" stroke-width="3.5" stroke-linejoin="round"
        opacity="0.9"/>

  <!-- ножки чипа -->
  <g stroke="url(#t)" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <line x1="100.4" y1="56" x2="108" y2="56"/>
    <line x1="100.4" y1="72" x2="108" y2="72"/>
    <line x1="27.6" y1="56" x2="20" y2="56"/>
    <line x1="27.6" y1="72" x2="20" y2="72"/>
  </g>

  <!-- монограмма K -->
  <line x1="52" y1="45" x2="52" y2="83" stroke="url(#k)" stroke-width="11"
        stroke-linecap="round"/>
  <path d="M77 45 L56.5 64 L77 83" fill="none" stroke="url(#k)"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- узлы схемы -->
  <circle cx="77" cy="45" r="4.4" fill="#3ee0cd"/>
  <circle cx="77" cy="83" r="4.4" fill="#3ee0cd"/>
</svg>
